name: Build KoreKara

on:
  push:
    branches: [codex/next-lyric-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore packages
        run: msbuild DesktopLyrics.sln /t:Restore /p:Configuration=Release '/p:Platform=Any CPU'
      - name: Build native composition helpers
        run: |
          msbuild native/DesktopLyricsGpu.vcxproj /p:Configuration=Release /p:Platform=Win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild native/DesktopLyricsGpu.vcxproj /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build plugin and package
        run: msbuild DesktopLyrics.sln /p:Configuration=Release '/p:Platform=Any CPU'
      - name: Check lyrics, timing edits, queue and artwork palette
        run: |
          msbuild tests/ParserSmoke.csproj /t:Restore /p:Configuration=Release
          msbuild tests/ParserSmoke.csproj /p:Configuration=Release
          & .\tests\bin\Release\ParserSmoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build isolated Direct2D feasibility probe
        run: msbuild tools/GpuRenderProbe.vcxproj /p:Configuration=Release /p:Platform=x64
      - name: Build and run isolated lyric quality comparison
        run: |
          msbuild tools/TextQualityProbe.vcxproj /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tools/TextQualityFixtures.csproj /p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tools\bin\Release\TextQualityFixtures.exe tools/text-quality
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tools\bin\Release\TextQualityProbe.exe tools/text-quality
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tools\bin\Release\TextQualityProbe.exe tools/text-quality gdi-outlines
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build isolated rendering benchmarks
        run: |
          msbuild tools/GdiRenderBenchmark.csproj /p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tools/DancerPreparationBenchmark.csproj /p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check GPU composition or safe hardware fallback in both architectures
        run: |
          foreach ($arch in @('x86', 'x64')) {
            msbuild tools/GpuCompositionChecks.csproj /p:PlatformTarget=$arch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ".\tools\bin\$arch\GpuCompositionChecks.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: KoreKara-1.15.73.0
          path: |
            bin/Release/mb_DesktopLyrics.dll
            bin/Release/DesktopLyricsGpu.*.dll
            pkg/*.zip
            tools/bin/Release/GpuRenderProbe.exe
            tools/bin/Release/GdiRenderBenchmark.exe
            tools/bin/Release/DancerPreparationBenchmark.exe
            tools/bin/Release/TextQuality*.exe
            tools/text-quality/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Failed-rendering-diagnostics-not-for-installation
          path: |
            bin/Release/*.dll
            tools/bin/*/gpu-check-images/*.png
          if-no-files-found: ignore
